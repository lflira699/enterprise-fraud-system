spring:
  application:
    name: efs-backend

  datasource:
    url: jdbc:postgresql://localhost:5432/efs
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    user: ${FLYWAY_USERNAME}
    password: ${FLYWAY_PASSWORD}

  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true

  mail:
    host: ${EFS_SMTP_HOST:}
    port: ${EFS_SMTP_PORT:25}
    username: ${EFS_SMTP_USERNAME:}
    password: ${EFS_SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${EFS_SMTP_AUTH:false}
          starttls:
            enable: ${EFS_SMTP_STARTTLS_ENABLE:false}

server:
  port: 8080

management:
  health:
    mail:
      enabled: ${EFS_SMTP_ENABLED:false}
  endpoints:
    web:
      exposure:
        include: health,info
efs:
  security:
    enabled: ${EFS_SECURITY_ENABLED:true}
    jwt:
      issuer-uri: ${EFS_JWT_ISSUER_URI:https://unconfigured.invalid/efs}
      jwk-set-uri: ${EFS_JWT_JWK_SET_URI:https://unconfigured.invalid/efs/jwks}
      audience: ${EFS_JWT_AUDIENCE:UNCONFIGURED_EFS_AUDIENCE}

  integration:
    outbox:
      publisher-confirm-timeout-ms: ${EFS_OUTBOX_PUBLISHER_CONFIRM_TIMEOUT_MS:5000}
      dispatch:
        enabled: ${EFS_OUTBOX_DISPATCH_ENABLED:false}
        interval-ms: ${EFS_OUTBOX_DISPATCH_INTERVAL_MS:1000}

    notification:
      smtp:
        enabled: ${EFS_SMTP_ENABLED:false}
        from: ${EFS_SMTP_FROM:}
