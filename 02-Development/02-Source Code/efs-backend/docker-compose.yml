services:
  postgres:
    image: postgres:18.4
    container_name: efs-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - efs_postgres_data:/var/lib/postgresql

  rabbitmq:
    image: rabbitmq:4-management
    container_name: efs-rabbitmq
    restart: unless-stopped
    ports:
      - "5672:5672"
      - "15672:15672"

volumes:
  efs_postgres_data:
