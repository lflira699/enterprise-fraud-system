services:

  prometheus:
    image: prom/prometheus:v3.14.0@sha256:5ce7540c3c00ef4ab0c9d2c995c6a5b9c421f44b4a115d97a2c7af3b1c21cbb0
    container_name: efs-prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/prometheus/rules:/etc/prometheus/rules:ro
      - efs_prometheus_data:/prometheus
    depends_on:
      - alertmanager
      - rabbitmq

  alertmanager:
    image: prom/alertmanager:v0.34.1@sha256:e9733bafb1bdef9b00e25a21f8f99dc26a22224bf16641ad754d1649f4c3357a
    container_name: efs-alertmanager
    restart: unless-stopped
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    ports:
      - "127.0.0.1:9093:9093"
    volumes:
      - ./observability/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - efs_alertmanager_data:/alertmanager

  loki:
    image: grafana/loki:3.7.8@sha256:1107dd5274e0ada47e42472b7a7e71f3b2a2fe878878108f3e2f9e51528f0193
    container_name: efs-loki
    restart: unless-stopped
    command:
      - -config.file=/etc/loki/loki.yml
    volumes:
      - ./observability/loki/loki.yml:/etc/loki/loki.yml:ro
      - efs_loki_data:/loki

  otel-storage-init:
    image: busybox:1.37.0@sha256:9db7b59979c38555a39def84a31fb98b5296952f9e3afd4f6f11f05b07adfab0
    container_name: efs-otel-storage-init
    restart: "no"
    user: "0:0"
    command:
      - sh
      - -ec
      - >-
        set -eu;
        mkdir -p /var/lib/otelcol/file_storage/receiver;
        mkdir -p /var/lib/otelcol/file_storage/exporter;
        chown 10001:10001 /var/lib/otelcol/file_storage;
        chown 10001:10001 /var/lib/otelcol/file_storage/receiver;
        chown 10001:10001 /var/lib/otelcol/file_storage/exporter;
        chmod 0750 /var/lib/otelcol/file_storage;
        chmod 0750 /var/lib/otelcol/file_storage/receiver;
        chmod 0750 /var/lib/otelcol/file_storage/exporter
    volumes:
      - efs_otel_state:/var/lib/otelcol/file_storage

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.161.0@sha256:fd328de2552466ad78385e1b1289c3f2402b1c45f265b252aab1955b42845ac1
    container_name: efs-otel-collector
    restart: unless-stopped
    command:
      - --config=/etc/otelcol-contrib/config.yml
    volumes:
      - ./observability/otel/otel-collector.yml:/etc/otelcol-contrib/config.yml:ro
      - ./runtime/logs:/var/log/efs:ro
      - efs_otel_state:/var/lib/otelcol/file_storage
    depends_on:
      loki:
        condition: service_started
      otel-storage-init:
        condition: service_completed_successfully

  grafana:
    image: grafana/grafana:13.2.2@sha256:ac461fb352abc50da10a51c7d02462e9c05488f11f53f14b3ad79a8145f638a0
    container_name: efs-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana_admin_password
    ports:
      - "127.0.0.1:3000:3000"
    secrets:
      - grafana_admin_password
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - efs_grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
      - loki

  postgres-exporter:
    image: quay.io/prometheuscommunity/postgres-exporter:v0.20.1@sha256:ac5ec343104fae0e2d84a27bb8d69b38430a11910c5382cad85d478d2bab713e
    container_name: efs-postgres-exporter
    restart: unless-stopped
    profiles:
      - postgres-exporter
    environment:
      DATA_SOURCE_URI_FILE: /run/secrets/postgres_exporter_uri
      DATA_SOURCE_USER_FILE: /run/secrets/postgres_exporter_user
      DATA_SOURCE_PASS_FILE: /run/secrets/postgres_exporter_password
    secrets:
      - postgres_exporter_uri
      - postgres_exporter_user
      - postgres_exporter_password
    depends_on:
      - postgres

secrets:

  grafana_admin_password:
    file: ${EFS_GRAFANA_ADMIN_PASSWORD_FILE}

  postgres_exporter_uri:
    file: ${EFS_POSTGRES_EXPORTER_URI_FILE}

  postgres_exporter_user:
    file: ${EFS_POSTGRES_EXPORTER_USER_FILE}

  postgres_exporter_password:
    file: ${EFS_POSTGRES_EXPORTER_PASSWORD_FILE}

volumes:

  efs_prometheus_data:
  efs_alertmanager_data:
  efs_loki_data:
  efs_grafana_data:
  efs_otel_state:
